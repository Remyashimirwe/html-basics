<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Today task</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }
        .navbar{
            background: gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        h2{
            font-size: 16px;
        }
        ul{
            list-style: none;
            display: flex;
            gap: 20px;
        }
        ul li {
            cursor: pointer;
        }
        ul li:hover{
            border-top: 2px solid black;
        }
        .container{
            display: flex;
            height: 100vh;
        }
        .card{
            align-items: center;
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin: 20px;
            background: gray;
            height: 50%;
            width: 40%;
        }
        .card h1{
            font-size: 15px;
            font-weight: bold;
        }
        .card p{
            padding: 10px;
            font-size: 10px;
            color: white;
        }
        .card img{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (max-width: 268px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h2>Future focus</h2>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
    </ul>
</nav>
<div class="container">
    <div class="card">
        <img src="/assets/profile.jpg" alt="profile" style="width: 100%; height: auto;">

    </div>

    </div>
    
</div>
</body>
</html>
