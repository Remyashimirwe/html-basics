<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamburger Menu</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --accent: #38bdf8;
        --shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0b1220;
        color: var(--fg);
      }

      .navbar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: var(--bg);
        box-shadow: var(--shadow);
      }

      .logo {
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: var(--fg);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .nav-links a:hover {
        color: var(--accent);
      }

      .hamburger {
        display: none;
        cursor: pointer;
        color: var(--fg);
        padding: 6px;
        border-radius: 8px;
        border: 1px solid transparent;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      .hamburger:hover {
        border-color: #e2e8f04d;
        color: var(--accent);
      }

      @media (max-width: 468px) {
        .hamburger {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .nav-links {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          flex-direction: column;
          background: #111827;
          padding: 16px 20px;
          gap: 14px;
          transform: translateY(-10px);
          opacity: 0;
          pointer-events: none;
          transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-links.active {
          transform: translateY(0);
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MySite</div>

      <div class="hamburger" id="hamburger">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </div>

      <ul class="nav-links" id="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <script>
      const hamburger = document.getElementById("hamburger");
      const navLinks = document.getElementById("nav-links");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navLinks.classList.toggle("active");
      });
    </script>
  </body>
</html>
