<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        form{
            background-color: #ccc;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            gap: 10px;
        }
        label{
            font-weight: bold;
        }
        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            width: 100%;
        }
        button{
            padding: 15px;
            background-color: #007BFF;
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            cursor: pointer;
        }
        .btn{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .already{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }
        .already a{
            color: #007BFF;
            text-decoration: none;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
    </style>

</head>
<body>
    <div class="container">
    <form>
        <h2>Register</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <div class="btn">
             <button type="submit">Register</button>
        </div>
        <div class="already">
            <p>Already have an account? <a href="#">Login here</a></p>
        </div>
    </form>
    </div>
</body>
</html>
